<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayNest — Hotel & Hospitality Management</title>
    <script>
      // Apply the saved theme before first paint, so a dark-mode user never sees a white flash.
      // Key and fallback must stay in sync with src/context/ThemeContext.jsx.
      (function () {
        try {
          var t = localStorage.getItem('staynest-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-bs-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-bs-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
