#spring.application.name=iam-service

server:
  port: 8081

spring:
  application:
    name: iam-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/iam_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:staynest-secret-key-for-jwt-signing-2026}
  expiration: 86400000
